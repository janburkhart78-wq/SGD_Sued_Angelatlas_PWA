<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Angelatlas">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SGD Süd Angelatlas App V1.3</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>SGD Süd Angelatlas</h1>
      <p>Version 1.3 · Rhein km 352–438</p>
    </div>
    <div class="header-actions">
      <button id="panelToggleBtn" class="ghost-button panel-header-toggle" type="button" aria-expanded="true" aria-controls="panel">Karte</button>
      <button id="locateBtn" class="ghost-button" type="button">📍 Standort</button>
    </div>
  </header>

  <main>
    <section id="map" aria-label="Angelatlas Karte"></section>

    <aside id="panel" class="info-panel">
      <div class="panel-handle"></div>
      <div class="panel-titlebar">
        <div>
          <h2>Spot prüfen</h2>
          <p class="panel-mini">Fischart, Werte, Ergebnis</p>
        </div>
      </div>

      <div id="panelBody" class="panel-body">
      <p class="muted">Tippe auf die Karte. Die App prüft Erlaubnis, Rhein-km, Buhnennähe und Fangprognose.</p>

      <div class="controls-grid">
        <label>
          Fischart
          <select id="speciesSelect"></select>
        </label>
        <label>
          Zeitpunkt
          <input id="datetimeInput" type="datetime-local">
        </label>
        <label>
          Wassertemp. °C
          <input id="waterTempInput" type="number" inputmode="decimal" value="20" step="0.1">
        </label>
        <label>
          Sichttiefe m
          <input id="visibilityInput" type="number" inputmode="decimal" value="0.6" step="0.1">
        </label>
        <label class="wide">
          Luftdruckreihe hPa
          <input id="pressureSeriesInput" value="1012,1011.6,1011.3,1011.2">
        </label>
        <label>
          Darstellung
          <select id="themeSelect">
            <option value="system">System</option>
            <option value="light">Hell</option>
            <option value="dark">Dunkel</option>
          </select>
        </label>
        <label>
          Kartenhelligkeit %
          <input id="mapBrightnessInput" type="number" inputmode="numeric" value="100" min="55" max="125" step="5">
        </label>
      </div>

      <div id="result" class="result empty">
        Noch kein Punkt gewählt.
      </div>

      <details>
        <summary>Layer</summary>
        <div id="layerToggles" class="layer-toggles"></div>
      </details>

      <p class="legal-note">Hinweis: Die App ersetzt nicht Erlaubnisschein, Beschilderung oder amtliche Regeln.</p>
      </div>
    </aside>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data_bundle.js"></script>
  <script src="app.js"></script>
</body>
</html>
